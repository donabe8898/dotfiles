dumpdev="AUTO"
zfs_enable="YES"

kld_list="nvidia-modeset"
#consolekit_enable="YES"
dbus_enable="YES"
#sddm_enable="YES"
lightdm_enable="YES"
# polkitd_enable="YES"
seatd_enable="YES"
ifconfig_re0="DHCP"
rpcbind_enable="YES"
dtcms_enable="YES"
inetd_enable="YES"
